name: Build Signed Android APK

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release preflight
        shell: bash
        run: bash scripts/release-preflight.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # We intentionally do NOT use android-actions/setup-android@v3 here:
      # that action currently tries to install the obsolete SDK package "tools",
      # which is the failure seen in the previous workflow.
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.YTM_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.YTM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YTM_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "YTM_KEYSTORE_B64 is missing"
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "YTM_STORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "YTM_KEY_PASSWORD is missing"
            exit 1
          fi

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.YTM_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > ytm-importer-release.jks
          ls -lh ytm-importer-release.jks

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.YTM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YTM_KEY_PASSWORD }}
        run: |
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "ytm-importer-release.jks" \
            "$STORE_PASSWORD" \
            "ytmimporter" \
            "$KEY_PASSWORD" \
            > release-signing.properties

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk YTM-Importer-v1.4.14-release.apk
          ls -lh YTM-Importer-v1.4.14-release.apk

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"
          APK="YTM-Importer-v1.4.14-release.apk"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT"

          echo "== Signature =="
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "== Zip alignment =="
          "$ZIPALIGN" -c -v 4 "$APK"

          echo "== Package/version =="
          "$AAPT" dump badging "$APK" |
            grep -E "^package:|^sdkVersion:|^targetSdkVersion:" |
            head -20

          echo "== SHA-256 =="
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: YTM-Importer-v1.4.14-Release
          path: |
            YTM-Importer-v1.4.14-release.apk
            YTM-Importer-v1.4.14-release.apk.sha256
