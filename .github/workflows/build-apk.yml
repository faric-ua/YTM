name: Build Signed Android APK

# WAVE3 QA TEMP MODE: fixture

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release preflight
        shell: bash
        run: bash scripts/release-preflight.sh

      - name: Apply Wave 3 QA clone channel
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.saney.ytmimporter"' app/build.gradle.kts
          sed -i 's/applicationId = "com.saney.ytmimporter"/applicationId = "com.saney.ytmimporter.updaterqa"/' app/build.gradle.kts
          grep -Fq 'android:label="YTM Importer"' app/src/main/AndroidManifest.xml
          sed -i 's/android:label="YTM Importer"/android:label="YTM Importer QA"/' app/src/main/AndroidManifest.xml

          python - <<'PY_QA'
          from pathlib import Path

          remote = Path(
              "app/src/main/java/com/saney/ytmimporter/"
              "updater/UpdaterRemoteOperations.kt"
          )
          text = remote.read_text()

          old = (
              '    const val MANIFEST_URL =\n'
              '        "https://github.com/faric-ua/YTM/releases/latest/download/" +\n'
              '            "YTM-Importer-update.json"'
          )
          new = (
              '    const val MANIFEST_URL =\n'
              '        "https://github.com/faric-ua/YTM/releases/download/'
              'v1.4.49-updater-qa2/YTM-Importer-update.json"'
          )

          if text.count(old) != 1:
              raise SystemExit("stable manifest URL anchor changed")

          remote.write_text(text.replace(old, new, 1))

          service = Path(
              "app/src/main/java/com/saney/ytmimporter/ServiceActivity.kt"
          )
          text = service.read_text()

          old = '"Джерело: офіційний GitHub Release faric-ua/YTM."'
          new = '"Джерело: QA GitHub prerelease faric-ua/YTM."'

          if text.count(old) != 1:
              raise SystemExit("stable source-label anchor changed")

          service.write_text(text.replace(old, new, 1))
          PY_QA

      - name: Apply Wave 3 QA fixture identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 92' app/build.gradle.kts
          grep -Fq 'versionName = "1.4.49"' app/build.gradle.kts
          sed -i 's/versionCode = 92/versionCode = 93/' app/build.gradle.kts
          sed -i 's/versionName = "1.4.49"/versionName = "1.4.49-updater-qa2"/' app/build.gradle.kts
          grep -Fq 'versionCode = 93' app/build.gradle.kts
          grep -Fq 'versionName = "1.4.49-updater-qa2"' app/build.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve release names
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=YTM-Importer-v${APP_VERSION}-release.apk" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=YTM-Importer-v${APP_VERSION}-Release" >> "$GITHUB_ENV"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.YTM_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.YTM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YTM_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.YTM_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > ytm-importer-release.jks

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.YTM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YTM_KEY_PASSWORD }}
        run: |
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "ytm-importer-release.jks" \
            "$STORE_PASSWORD" \
            "ytmimporter" \
            "$KEY_PASSWORD" \
            > release-signing.properties

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          ls -lh "$APK_NAME"

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"
          APK="$APK_NAME"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:" | head -20
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
