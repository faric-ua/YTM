name: Build Signed Android APK

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release preflight
        shell: bash
        run: bash scripts/release-preflight.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve release names
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=YTM-Importer-v${APP_VERSION}-release.apk" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=YTM-Importer-v${APP_VERSION}-Release" >> "$GITHUB_ENV"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.YTM_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.YTM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YTM_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.YTM_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > ytm-importer-release.jks

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.YTM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YTM_KEY_PASSWORD }}
        run: |
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "ytm-importer-release.jks" \
            "$STORE_PASSWORD" \
            "ytmimporter" \
            "$KEY_PASSWORD" \
            > release-signing.properties

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          ls -lh "$APK_NAME"

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"
          APK="$APK_NAME"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:" | head -20
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
