name: Build Signed Android APK

on:
  workflow_dispatch:
    inputs:
      qa_manifest_url:
        description: "QA-only updater manifest URL; empty keeps the stable channel"
        required: false
        default: ""
        type: string
      qa_version_name:
        description: "QA-only build versionName override"
        required: false
        default: ""
        type: string
      qa_version_code:
        description: "QA-only build versionCode override"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release preflight
        shell: bash
        run: bash scripts/release-preflight.sh

      - name: Apply QA build overrides
        if: ${{ inputs.qa_manifest_url != '' || inputs.qa_version_name != '' || inputs.qa_version_code != '' }}
        shell: bash
        env:
          QA_MANIFEST_URL: ${{ inputs.qa_manifest_url }}
          QA_VERSION_NAME: ${{ inputs.qa_version_name }}
          QA_VERSION_CODE: ${{ inputs.qa_version_code }}
        run: |
          set -euo pipefail
          python - <<'PY_QA'
          import os
          import re
          from pathlib import Path

          manifest_url = os.environ.get("QA_MANIFEST_URL", "").strip()
          version_name = os.environ.get("QA_VERSION_NAME", "").strip()
          version_code = os.environ.get("QA_VERSION_CODE", "").strip()

          if bool(version_name) != bool(version_code):
              raise SystemExit(
                  "QA versionName/versionCode overrides must be supplied together"
              )

          if manifest_url:
              prefix = "https://github.com/faric-ua/YTM/releases/download/"
              suffix = "/YTM-Importer-update.json"

              if not (
                  manifest_url.startswith(prefix)
                  and manifest_url.endswith(suffix)
              ):
                  raise SystemExit(
                      "QA manifest URL must be a faric-ua/YTM GitHub Release asset"
                  )

              remote = Path(
                  "app/src/main/java/com/saney/ytmimporter/"
                  "updater/UpdaterRemoteOperations.kt"
              )
              remote_text = remote.read_text()

              stable = '''    const val MANIFEST_URL =
        "https://github.com/faric-ua/YTM/releases/latest/download/" +
            "YTM-Importer-update.json"'''

              qa = (
                  '    const val MANIFEST_URL =\n'
                  f'        "{manifest_url}"'
              )

              if remote_text.count(stable) != 1:
                  raise SystemExit(
                      "stable updater manifest URL anchor changed"
                  )

              remote.write_text(
                  remote_text.replace(stable, qa, 1)
              )

              service = Path(
                  "app/src/main/java/com/saney/ytmimporter/ServiceActivity.kt"
              )
              service_text = service.read_text()

              stable_label = (
                  '"Джерело: офіційний GitHub Release faric-ua/YTM."'
              )
              qa_label = (
                  '"Джерело: QA GitHub prerelease faric-ua/YTM."'
              )

              if service_text.count(stable_label) != 1:
                  raise SystemExit(
                      "stable updater channel label anchor changed"
                  )

              service.write_text(
                  service_text.replace(stable_label, qa_label, 1)
              )

              print("QA updater channel override:", manifest_url)

          if version_name:
              if not re.fullmatch(
                  r"1\.4\.49-updater-qa[0-9]+",
                  version_name
              ):
                  raise SystemExit(
                      "QA versionName must match 1.4.49-updater-qaN"
                  )

              try:
                  code = int(version_code)
              except ValueError as error:
                  raise SystemExit(
                      "QA versionCode must be an integer"
                  ) from error

              if code <= 92:
                  raise SystemExit(
                      "QA versionCode must be greater than production code 92"
                  )

              gradle = Path("app/build.gradle.kts")
              gradle_text = gradle.read_text()

              old = '''        versionCode = 92
        versionName = "1.4.49"'''
              new = (
                  f"        versionCode = {code}\n"
                  f'        versionName = "{version_name}"'
              )

              if gradle_text.count(old) != 1:
                  raise SystemExit(
                      "production version anchor changed"
                  )

              gradle.write_text(
                  gradle_text.replace(old, new, 1)
              )

              print(
                  "QA build identity override:",
                  version_name,
                  code
              )
          PY_QA

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve release names
        shell: bash
        env:
          QA_MANIFEST_URL: ${{ inputs.qa_manifest_url }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          if [ -n "$QA_MANIFEST_URL" ]; then
            echo "APK_NAME=YTM-Importer-v${APP_VERSION}-qa-channel.apk" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=YTM-Importer-v${APP_VERSION}-QA-Channel" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=YTM-Importer-v${APP_VERSION}-release.apk" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=YTM-Importer-v${APP_VERSION}-Release" >> "$GITHUB_ENV"
          fi

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.YTM_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.YTM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YTM_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.YTM_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > ytm-importer-release.jks

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.YTM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YTM_KEY_PASSWORD }}
        run: |
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "ytm-importer-release.jks" \
            "$STORE_PASSWORD" \
            "ytmimporter" \
            "$KEY_PASSWORD" \
            > release-signing.properties

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          ls -lh "$APK_NAME"

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"
          APK="$APK_NAME"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:" | head -20
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
